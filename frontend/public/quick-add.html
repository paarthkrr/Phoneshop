<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Add Device</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 20px; background: #111; color: #fff; max-width: 500px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
    label { display: block; font-size: 12px; color: #888; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 15px; }
    input:read-only { opacity: 0.6; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; }
    .primary { background: #8B3A4C; color: #fff; }
    .primary:hover { background: #6B2D3C; }
    .secondary { background: #333; color: #fff; }
    .status { padding: 12px; border-radius: 8px; margin-top: 16px; font-size: 14px; }
    .ok { background: #1a3a1a; color: #6f6; }
    .info { background: #1a2a3a; color: #6cf; }
  </style>
</head>
<body>
  <h1>Quick Add Device</h1>
  <p class="subtitle">Connect phone via USB, then click scan or details auto-fill</p>
  
  <button class="secondary" onclick="scanUSB()">📱 Scan USB Device</button>
  <div id="scan-status"></div>

  
  <label>IMEI</label>
  <input id="imei" placeholder="Auto-detected">
  <button class="secondary" onclick="checkStolen()" style="margin-top:8px">🔍 Check Stolen Status</button>
  <div id="stolen-result"></div>

  
  <div class="row">
    <div>
      <label>Model</label>
      <select id="model">
        <option value="">Select...</option>
        <option>iPhone 16 Pro Max</option>
        <option>iPhone 16 Pro</option>
        <option>iPhone 15 Pro Max</option>
        <option>iPhone 15 Pro</option>
        <option>iPhone 14 Pro Max</option>
        <option>iPhone 14 Pro</option>
        <option>iPhone 13 Pro Max</option>
      </select>
    </div>
    <div>
      <label>Year</label>
      <input id="year" placeholder="Auto or edit">
    </div>
  </div>
  
  <div class="row">
    <div>
      <label>Storage</label>
      <select id="storage">
        <option>128GB</option>
        <option>256GB</option>
        <option>512GB</option>
        <option>1TB</option>
      </select>
    </div>
    <div>
      <label>Color</label>
      <input id="color" placeholder="Auto-detected or edit">
    </div>
  </div>
  
  <label>Serial</label>
  <input id="serial" placeholder="Auto-detected" readonly>
  
  
  <label>iOS Version</label>
  <input id="ios" placeholder="Auto-detected">
  
  <div class="row">
    <div>
      <label>Battery Health</label>
      <input id="battery" placeholder="Auto or edit %">
    </div>
    <div>
      <label>Cycle Count</label>
      <input id="cycles" placeholder="Auto">
    </div>
  </div>
  
  <div class="row">
    <div>
      <label>Find My</label>
      <input id="findmy" placeholder="Auto" readonly style="color:#f66">
    </div>
    <div>
      <label>Activation</label>
      <input id="activation" placeholder="Auto" readonly>
    </div>
  </div>

  
  <label>Buy Price ($)</label>
  <input id="price" type="number" placeholder="Enter price">
  
  
  

  <label>Grade</label>
  <select id="grade">
    <option value="A">A - Like New</option>
    <option value="B">B - Excellent</option>
    <option value="C">C - Good</option>
    <option value="D">D - Fair</option>
  </select>
  
  <label>Sell Price ($)</label>
  <input id="sellprice" type="number" placeholder="Auto-calculated" readonly style="color:#6f6">
  
  <label>Buy Price ($)</label>
  <input id="price" type="number" placeholder="Enter buy price">
  
  <button class="primary" onclick="addDevice()">Add to Inventory</button>
  <div id="status"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const set = (id, key) => { if (params.get(key)) document.getElementById(id).value = params.get(key); };
    set('imei', 'imei');
    set('year', 'year');
    set('color', 'color');
    set('serial', 'serial');
    set('ios', 'ios');
    set('battery', 'battery');
    set('cycles', 'cycles');
    if (params.get('model')) {
      const sel = document.getElementById('model');
      for (let opt of sel.options) {
        if (opt.value === params.get('model')) { sel.value = opt.value; break; }
      }
    }
    if (params.get('storage')) {
      const sel = document.getElementById('storage');
      for (let opt of sel.options) {
        if (opt.value === params.get('storage')) { sel.value = opt.value; break; }
      }
    }
    
    
    async function scanUSB() {
      const status = document.getElementById('scan-status');
      status.innerHTML = '<div class="status info">Scanning...</div>';
      try {
        const res = await fetch('http://localhost:19876/scan');
        const data = await res.json();
        if (data.error) {
          status.innerHTML = '<div class="status" style="background:#3a1a1a;color:#f66">' + data.error + '</div>';
          return;
        }
        // Fill form
        if (data.imei) document.getElementById('imei').value = data.imei;
        if (data.serial) document.getElementById('serial').value = data.serial;
        if (data.year) document.getElementById('year').value = data.year;
        if (data.color) document.getElementById('color').value = data.color;
        if (data.ios) document.getElementById('ios').value = data.ios;
        if (data.battery) document.getElementById('battery').value = data.battery + '%'; else document.getElementById('battery').value = 'N/A';
        if (data.cycles) document.getElementById('cycles').value = data.cycles;
        if (data.findmy) document.getElementById('findmy').value = data.findmy;
        if (data.activation) document.getElementById('activation').value = data.activation; else document.getElementById('cycles').value = 'N/A';
        if (data.model) {
          const sel = document.getElementById('model');
          for (let opt of sel.options) if (opt.value === data.model) sel.value = opt.value;
        }
        if (data.storage) {
          const sel = document.getElementById('storage');
          for (let opt of sel.options) if (opt.value === data.storage) sel.value = opt.value;
        }
        status.innerHTML = '<div class="status ok">✓ Device scanned</div>';
      } catch (e) {
        status.innerHTML = '<div class="status" style="background:#3a1a1a;color:#f66">Server not running. Start: python3 ~/Desktop/scan-server.py</div>';
      }
    }
    
    function showScanHelp() {

      document.getElementById('scan-help').style.display = 'block';
    }
    
    
    async function checkStolen() {
      const imei = document.getElementById('imei').value;
      const result = document.getElementById('stolen-result');
      if (!imei || imei.length < 15) {
        result.innerHTML = '<div class="status" style="background:#3a1a1a;color:#f66">Enter 15-digit IMEI</div>';
        return;
      }
      result.innerHTML = '<div class="status info">Checking AMTA database...</div>';
      // Open AMTA check in new tab (no public API, so direct link)
      window.open('https://amta.org.au/consumer-advice/check-the-status-of-your-handset/', '_blank');
      result.innerHTML = '<div class="status info">AMTA check opened in new tab. Look for "NOT reported as lost or stolen"</div>';
    }
    
    
    
    function updateGrade() {
      const issues = [
        document.getElementById('c-screen').checked,
        document.getElementById('c-body').checked,
        document.getElementById('c-battery').checked,
        document.getElementById('c-crack').checked,
        document.getElementById('c-water').checked
      ].filter(Boolean).length;
      
      const gradeSel = document.getElementById('grade');
      const hint = document.getElementById('grade-hint');
      
      if (issues === 0) {
        gradeSel.value = 'A';
        hint.textContent = 'Suggested: Grade A (Like New) - Full price';
      } else if (issues === 1) {
        gradeSel.value = 'B';
        hint.textContent = 'Suggested: Grade B (Excellent) - 10% off';
      } else if (issues === 2) {
        gradeSel.value = 'C';
        hint.textContent = 'Suggested: Grade C (Good) - 20% off';
      } else {
        gradeSel.value = 'D';
        hint.textContent = 'Suggested: Grade D (Fair) - 30% off';
      }
      calcPrice();
    }
    
    function calcPrice() {

      const buy = Number(document.getElementById('price').value) || 0;
      const grade = document.getElementById('grade').value;
      const multipliers = { A: 1.0, B: 0.9, C: 0.8, D: 0.7 };
      const sell = Math.round(buy * multipliers[grade]);
      document.getElementById('sellprice').value = sell || '';
    }
    document.getElementById('price').addEventListener('input', calcPrice);
    document.getElementById('grade').addEventListener('change', calcPrice);
    
    function addDevice() {


      const data = {
        imei: document.getElementById('imei').value,
        model: document.getElementById('model').value,
        year: document.getElementById('year').value,
        storage: document.getElementById('storage').value,
        color: document.getElementById('color').value,
        serial: document.getElementById('serial').value,
        ios: document.getElementById('ios').value,
        price: Number(document.getElementById('price').value),
        grade: document.getElementById('grade').value,
        addedAt: new Date().toISOString()
      };
      if (!data.model || !data.price) {
        document.getElementById('status').innerHTML = '<div class="status" style="background:#3a1a1a;color:#f66">Model and price required</div>';
        return;
      }
      const id = 'QA-' + Date.now();
      const item = { ...data, id, status: 'available', brand: 'Apple', barcode: data.imei };
      
      // Save to quick-adds
      const qa = JSON.parse(localStorage.getItem('quick-adds') || '[]');
      qa.push(item);
      localStorage.setItem('quick-adds', JSON.stringify(qa));
      
      // Save to main inventory (for shop listing)
      const inventory = JSON.parse(localStorage.getItem('inventory') || '[]');
      inventory.push(item);
      localStorage.setItem('inventory', JSON.stringify(inventory));
      document.getElementById('status').innerHTML = '<div class="status ok">✓ Added to inventory<br><a href="/shop" style="color:#6f6;margin-top:8px;display:inline-block">View in Shop →</a></div>';
    }
  </script>
</body>
</html>
