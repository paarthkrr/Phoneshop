<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F4EC" />
    <title>Mobile Vault — Cheapest Repairs, Genuine Parts, Price Match Guarantee</title>
    <meta name="description" content="Same-day repairs on phones, tablets, laptops and watches — genuine parts only, unbeatable prices, and a real price match guarantee. Trade in your old device or buy graded refurbished stock with a warranty." />

    <!-- Open Graph — controls how the site looks when shared on social/messaging apps -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mobile Vault — Cheapest Repairs, Genuine Parts, Price Match Guarantee" />
    <meta property="og:description" content="Same-day repairs on phones, tablets, laptops and watches — genuine parts only, unbeatable prices, and a real price match guarantee." />
    <meta property="og:locale" content="en_AU" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mobile Vault — Cheapest Repairs, Genuine Parts, Price Match Guarantee" />
    <meta name="twitter:description" content="Same-day repairs on phones, tablets, laptops and watches — genuine parts only, unbeatable prices, and a real price match guarantee." />

    <!-- LocalBusiness structured data — this is what lets Google show rich
         results (star rating, address, hours) in search instead of a plain
         blue link. Update the placeholder address/phone/hours once real
         ones exist; a schema block with fake specifics is worse than none,
         since Google penalizes markup that doesn't match visible content. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ElectronicsStore",
      "name": "Mobile Vault",
      "description": "Phone, tablet, laptop and watch repair using genuine parts only, with a price match guarantee. Also buys, sells, and trades in devices.",
      "priceRange": "$",
      "areaServed": "AU",
      "makesOffer": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Phone, tablet, laptop and watch repair — genuine parts, price match guarantee" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Device trade-in / buyback" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Refurbished device sales" } }
      ]
    }
    </script>

    <script>
      // Catches EVERYTHING, including a failure to load the app's own
      // script — this is why it lives here, before that script tag,
      // not inside the React app itself. A blank page with no visible
      // cause is the worst possible failure mode for a real customer;
      // this guarantees there's always something on screen to report.
      window.addEventListener("error", function (e) {
        showBootError(e.error ? (e.error.stack || e.error.message) : e.message);
      });
      window.addEventListener("unhandledrejection", function (e) {
        showBootError(e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : "Unknown error");
      });
      function showBootError(detail) {
        var root = document.getElementById("root");
        if (!root || root.dataset.appMounted === "true") return; // the real app already took over — don't stomp on it
        root.innerHTML =
          '<div style="max-width:480px;margin:60px auto;padding:20px;font-family:system-ui,sans-serif;color:#201C18;background:#F7F4EC;border:2px solid #8B2E2E;border-radius:4px;">' +
          '<div style="font-weight:700;font-size:18px;margin-bottom:10px;">Something went wrong loading the page</div>' +
          '<div style="font-size:13px;color:#6B6560;margin-bottom:14px;">Please screenshot this and send it back — it tells us exactly what to fix.</div>' +
          '<pre style="white-space:pre-wrap;word-break:break-word;font-size:11px;background:#fff;border:1px solid #201C18;padding:10px;border-radius:3px;">' +
          String(detail).replace(/</g, "&lt;") + "</pre></div>";
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="max-width:480px;margin:60px auto;padding:20px;font-family:system-ui,sans-serif;color:#6B6560;text-align:center;">
        Loading Mobile Vault…
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
