<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F4EC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mobile Vault — Cheapest Phone Repairs, Same Day In Store | Sell & Buy Phones</title>
    <meta name="description" content="Cheapest phone repairs, done same day in store with genuine parts. Sell your phone for an instant quote, or buy refurbished with a 1-year warranty and free express shipping." />

    <!-- Open Graph — controls how the site looks when shared on social/messaging apps -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mobile Vault — Cheapest Phone Repairs, Same Day In Store | Sell & Buy Phones" />
    <meta property="og:description" content="Cheapest phone repairs, done same day in store with genuine parts. Sell your phone for an instant quote, or buy refurbished with a 1-year warranty and free express shipping." />
    <meta property="og:locale" content="en_AU" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mobile Vault — Cheapest Phone Repairs, Same Day In Store | Sell & Buy Phones" />
    <meta name="twitter:description" content="Cheapest phone repairs, done same day in store with genuine parts. Sell your phone for an instant quote, or buy refurbished with a 1-year warranty and free express shipping." />

    <!-- LocalBusiness structured data — this is what lets Google show rich
         results (star rating, address, hours) in search instead of a plain
         blue link. The address and phone are added automatically from Business settings
         once entered (see SiteSchema in App.jsx); a schema block with fake specifics is worse than none,
         since Google penalizes markup that doesn't match visible content. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ElectronicsStore",
      "name": "Mobile Vault",
      "description": "Phone, tablet, laptop and watch repair using genuine parts only, with a price match guarantee. Also buys, sells, and trades in devices.",
      "priceRange": "$",
      "areaServed": "AU",
      "makesOffer": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Phone, tablet, laptop and watch repair — genuine parts, price match guarantee" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Device trade-in / buyback" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Refurbished device sales" } }
      ]
    }
    </script>

    <script>
      // The site moved to mobile-vault-web.onrender.com (the old address had a
      // broken host setting). Anyone arriving at the old address is sent to the
      // same page on the new one, so old links and bookmarks keep working.
      if (location.hostname === "phoneshop-frontend-51tg.onrender.com") {
        location.replace("https://mobile-vault-web.onrender.com" + location.pathname + location.search + location.hash);
      }
    </script>
    <script>
      // Boot guard. Lives in the HTML itself, before the app's script, so it
      // works even when the app's JavaScript never arrives.
      //
      // Known failure it handles: a CDN can keep serving an OLD copy of this
      // HTML after a deploy. That old copy points at JavaScript files from a
      // previous build, which no longer exist, so nothing ever loads and the
      // page is blank. A failed script download does NOT reach a normal
      // window "error" listener — it only arrives in the capture phase —
      // which is why the listener below passes `true`.
      (function () {
        var RETRY_FLAG = "mv_boot_retry";
        var mounted = function () {
          var r = document.getElementById("root");
          return r && r.dataset.appMounted === "true";
        };
        function alreadyRetried() {
          try { return sessionStorage.getItem(RETRY_FLAG) === "1"; } catch (e) { return true; }
        }
        // Try ONE automatic cache-bypassing reload before showing anything —
        // most visitors never see a problem at all. The flag stops loops.
        function recover(reason) {
          if (mounted()) return;
          if (!alreadyRetried()) {
            try { sessionStorage.setItem(RETRY_FLAG, "1"); } catch (e) {}
            var u = new URL(window.location.href);
            u.searchParams.set("_r", Date.now().toString(36));
            window.location.replace(u.toString());
            return;
          }
          showBootError(reason);
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t !== window && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
            recover("Couldn't load " + (t.src || t.href || "a page file") + " — the page files may be updating.");
            return;
          }
          if (!mounted()) showBootError(e.error ? (e.error.stack || e.error.message) : e.message);
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          if (!mounted()) showBootError(e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : "Unknown error");
        });
        // Watchdog: if the app still hasn't started after 10s, treat it as a
        // failed load rather than leaving the visitor staring at nothing.
        setTimeout(function () { recover("The page took too long to start."); }, 10000);

        window.showBootError = showBootError;
        function showBootError(detail) {
          var root = document.getElementById("root");
          if (!root || mounted()) return;
          root.innerHTML =
            '<div style="max-width:480px;margin:60px auto;padding:20px;font-family:system-ui,sans-serif;color:#201C18;background:#F7F4EC;border:2px solid #8B2E2E;border-radius:4px;">' +
            '<div style="font-weight:700;font-size:18px;margin-bottom:10px;">This page didn\'t load properly</div>' +
            '<div style="font-size:14px;color:#6B6560;margin-bottom:14px;">Please tap reload. If it keeps happening, screenshot this and send it to us.</div>' +
            '<button onclick="try{sessionStorage.removeItem(\'' + RETRY_FLAG + '\')}catch(e){};var u=new URL(location.href);u.searchParams.set(\'_r\',Date.now().toString(36));location.replace(u.toString())" ' +
            'style="padding:11px 20px;background:#2150C8;color:#fff;border:none;border-radius:3px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:14px;">Reload page</button>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;font-size:11px;background:#fff;border:1px solid #201C18;padding:10px;border-radius:3px;">' +
            String(detail).replace(/</g, "&lt;") + "</pre></div>";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="max-width:480px;margin:60px auto;padding:20px;font-family:system-ui,sans-serif;color:#6B6560;text-align:center;">
        Loading Mobile Vault…
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
