    <script>
      // The site moved to mobile-vault-web.onrender.com (the old address had a
      // broken host setting). Anyone arriving at the old address is sent to the
      // same page on the new one, so old links and bookmarks keep working.
      // Everything now lives at https://mobilerecellr.com.au. Old addresses (and www)
      // send visitors to the same page there, BUT only after checking the main domain
      // actually answers over https. If it doesn't (DNS still spreading, certificate
      // not issued yet), the visitor simply stays where they are and the site works.
      (function () {
        var OLD = ["phoneshop-frontend-51tg.onrender.com", "mobile-vault-web.onrender.com", "www.mobilerecellr.com.au", "mobile-recellr.com", "www.mobile-recellr.com"];
        if (OLD.indexOf(location.hostname) === -1 || !window.fetch) return;
        var target = "https://mobilerecellr.com.au" + location.pathname + location.search + location.hash;
        var done = false, timer = setTimeout(function () { done = true; }, 2500);
        fetch("https://mobilerecellr.com.au/favicon.svg?ping=" + Date.now(), { mode: "no-cors", cache: "no-store" })
          .then(function () { if (!done) { clearTimeout(timer); location.replace(target); } })
          .catch(function () { clearTimeout(timer); /* main domain not ready: stay here */ });
      })();
    </script>
    <script>
      // Boot guard. Lives in the HTML itself, before the app's script, so it
      // works even when the app's JavaScript never arrives.
      //
      // Known failure it handles: a CDN can keep serving an OLD copy of this
      // HTML after a deploy. That old copy points at JavaScript files from a
      // previous build, which no longer exist, so nothing ever loads and the
      // page is blank. A failed script download does NOT reach a normal
      // window "error" listener — it only arrives in the capture phase —
      // which is why the listener below passes `true`.
      (function () {
        var RETRY_FLAG = "mv_boot_retry";
        var mounted = function () {
          var r = document.getElementById("root");
          return r && r.dataset.appMounted === "true";
        };
        function alreadyRetried() {
          try { return sessionStorage.getItem(RETRY_FLAG) === "1"; } catch (e) { return true; }
        }
        // Try ONE automatic cache-bypassing reload before showing anything —
        // most visitors never see a problem at all. The flag stops loops.
        function recover(reason) {
          if (mounted()) return;
          if (!alreadyRetried()) {
            try { sessionStorage.setItem(RETRY_FLAG, "1"); } catch (e) {}
            var u = new URL(window.location.href);
            u.searchParams.set("_r", Date.now().toString(36));
            window.location.replace(u.toString());
            return;
          }
          showBootError(reason);
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t !== window && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
            recover("Couldn't load " + (t.src || t.href || "a page file") + " — the page files may be updating.");
            return;
          }
          if (!mounted()) showBootError(e.error ? (e.error.stack || e.error.message) : e.message);
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          if (!mounted()) showBootError(e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : "Unknown error");
        });
        // Watchdog: if the app still hasn't started after 10s, treat it as a
        // failed load rather than leaving the visitor staring at nothing.
        setTimeout(function () { recover("The page took too long to start."); }, 10000);

        window.showBootError = showBootError;
        function showBootError(detail) {
          var root = document.getElementById("root");
          if (!root || mounted()) return;
          root.innerHTML =
            '<div style="max-width:480px;margin:60px auto;padding:20px;font-family:system-ui,sans-serif;color:#111827;background:#FFFFFF;border:2px solid #8B2E2E;border-radius:4px;">' +
            '<div style="font-weight:700;font-size:18px;margin-bottom:10px;">This page didn\'t load properly</div>' +
            '<div style="font-size:14px;color:#5B6472;margin-bottom:14px;">Please tap reload. If it keeps happening, screenshot this and send it to us.</div>' +
            '<button onclick="try{sessionStorage.removeItem(\'' + RETRY_FLAG + '\')}catch(e){};var u=new URL(location.href);u.searchParams.set(\'_r\',Date.now().toString(36));location.replace(u.toString())" ' +
            'style="padding:11px 20px;background:#2150C8;color:#fff;border:none;border-radius:3px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:14px;">Reload page</button>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;font-size:11px;background:#fff;border:1px solid #E2E6EC;padding:10px;border-radius:3px;">' +
            String(detail).replace(/</g, "&lt;") + "</pre></div>";
        }
      })();
    </script>

    <script>
      // First visit this session: paint the intro's navy from the very first frame,
      // so there's no white flash before the logo animation starts (src/splash-intro.jsx).
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("intro");
          var forced = q === "5" || q === "6" || q === "8";
          if (q === "0" || (q && !forced)) return;
          if (!forced) {
            if (/^\/(portal|staff)/.test(location.pathname)) return;
            if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            if (/bot|crawl|spider|slurp|lighthouse|pagespeed|headless/i.test(navigator.userAgent) || navigator.webdriver) return;
            if (sessionStorage.getItem("mr_intro_seen") === "1") return;
          }
          document.documentElement.className += " mr-intro";
          if (!q || q === "8") { var l = document.createElement("link"); l.rel = "preload"; l.as = "image"; l.href = "/intro-photo.webp"; document.head.appendChild(l); }
          var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", "#0F1B3D");
        } catch (e) {}
      })();
